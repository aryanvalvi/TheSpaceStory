<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Space Story - Initializing</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #0f1115;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    .splash-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 40px;
      max-width: 440px;
      animation: fadeIn 0.6s ease-out;
    }
    .logo-container {
      width: 110px;
      height: 110px;
      border-radius: 24px;
      background: radial-gradient(circle, rgba(197, 168, 128, 0.15) 0%, rgba(15, 17, 21, 0) 70%);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .logo {
      width: 90px;
      height: 90px;
      object-fit: contain;
      filter: drop-shadow(0 4px 12px rgba(197, 168, 128, 0.3));
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #f0f3f6;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #c5a880;
      margin-bottom: 28px;
      font-weight: 600;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(197, 168, 128, 0.2);
      border-top-color: #c5a880;
      border-radius: 50%;
      animation: spin 0.9s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
      margin-bottom: 16px;
    }
    .status-text {
      font-size: 13px;
      color: #8b949e;
      letter-spacing: 0.3px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="splash-card">
    <div class="logo-container">
      <img src="logo.png" alt="The Space Story Logo" class="logo" />
    </div>
    <h1>The Space Story</h1>
    <div class="subtitle">Quotation & Studio System</div>
    <div class="spinner"></div>
    <div class="status-text" id="status">Connecting to Studio Database...</div>
  </div>
</body>
</html>
